<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopOS Design Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site/site.css">
  <link rel="stylesheet" href="site/viewer.css">
</head>
<body class="viewer">
  <header class="bar">
    <div class="wrap">
      <a class="btn raised" href="./">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
        <span class="hide-xs">All systems</span>
      </a>
      <span class="spacer"></span>
      <span id="bar-actions" class="bar-actions"></span>
    </div>
  </header>

  <div class="wrap shell">
    <aside class="side" id="side" aria-label="Sections"></aside>
    <main class="page" id="page" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="site/data.js"></script>
  <script src="site/shapes.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="site/viewer.js"></script>
</body>
</html>
