<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopOS Design Systems</title>
  <meta name="description" content="Every ShopOS studio's design system, ready to read and download.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site/site.css">
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <a class="mark" href="./"><i></i>ShopOS</a>
      <span class="spacer"></span>
      <a class="btn raised hide-sm" href="https://github.com/vedantvaibhav/Design-System-ShopOS-Studio">GitHub</a>
      <button class="btn green raised" type="button" id="download-all">
        <span>Download all</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1 id="line">One group, many studios.</h1>
    </section>
    <div class="bento" id="bento"></div>
  </main>

  <script src="site/data.js"></script>
  <script src="site/shapes.js"></script>
  <script>
    const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>';
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const vars = (it) => `--accent:${it.accent};--accent-ink:${it.ink || "var(--ink)"}`;
    const href = (it) => `system.html?id=${encodeURIComponent(it.id)}`;
    const dark = (it) => Boolean(it.ink) && it.ink.toLowerCase() !== "#ffffff";
    const status = (it) => it.stage ? `<span class="pill">${esc(it.stage)}</span>`
      : it.ready ? '<span class="pill ready">Ready</span>' : '<span class="pill">Soon</span>';

    // One bento of every slot, in the order of site/structure.json.
    const { groups, line } = window.DS;
    document.getElementById("line").textContent = line;
    const tiles = groups.flatMap((g) => g.items.map((it) => ({ ...it, group: g.label || g.title })));
    document.getElementById("bento").innerHTML = tiles.map((it) => `
      <a class="card raised${it.size ? ` ${it.size}` : ""}" href="${href(it)}" style="${vars(it)}">
        <div class="card-art">${shapeSvg(it.shape, dark(it))}${status(it)}</div>
        <div class="card-body">
          <div class="txt"><span class="kicker">${esc(it.group)} · ${esc(it.kicker)}</span><h3>${esc(it.name)}</h3></div>
          <span class="go">${arrow}</span>
        </div>
      </a>`).join("");

    // Download all: every ready system's folder in one zip, packed in the browser.
    const ready = tiles.filter((it) => it.ready && it.files);
    const button = document.getElementById("download-all");
    const label = button.querySelector("span");
    button.addEventListener("click", async () => {
      if (button.disabled) return;
      button.disabled = true;
      label.textContent = "Packing…";
      try {
        if (!window.JSZip) {
          await new Promise((res, rej) => {
            const s = Object.assign(document.createElement("script"), { src: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", onload: res, onerror: rej });
            document.head.append(s);
          });
        }
        const zip = new JSZip();
        await Promise.all(ready.flatMap((it) => it.files.map(async (f) => {
          const r = await fetch(`systems/${it.id}/${f}`);
          if (!r.ok) throw new Error(f);
          zip.folder(it.id).file(f, await r.blob());
        })));
        const blob = await zip.generateAsync({ type: "blob" });
        const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "shopos-design-systems.zip" });
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        label.textContent = "Download all";
      } catch {
        // Packing needs the site to be served; fall back to GitHub's archive.
        location.href = "https://github.com/vedantvaibhav/Design-System-ShopOS-Studio/archive/refs/heads/main.zip";
        label.textContent = "Download all";
      } finally {
        button.disabled = false;
      }
    });

    const bar = document.querySelector(".bar");
    const onScroll = () => bar.classList.toggle("scrolled", scrollY > 8);
    addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
